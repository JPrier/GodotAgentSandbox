<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9aa4b8; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0d12; text-align: center; padding: 16px; }
  #status.error { color: #ff8f8f; white-space: pre-wrap; }
  progress { width: 220px; display: block; margin: 10px auto 0; accent-color: #6ee7ff; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>
<div id="status"><div><div id="status-text">Loading engine…</div><progress id="progress"></progress></div></div>
<script>
// Hosts one Godot web runtime. The parent shell reloads this iframe for each new build;
// the engine .wasm/.js are cached (immutable URLs), so only the new .pck is fetched.
(() => {
  const q = new URLSearchParams(location.search);
  const enginePath = q.get('engine');           // e.g. /engine/4.7.2.stable-web_nothreads_debug/
  const pck = q.get('pck');
  const build = Number(q.get('build'));
  const parentOrigin = location.origin;
  const post = (msg) => parent.postMessage({ __gck: true, ...msg }, parentOrigin);
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const progress = document.getElementById('progress');

  // ---- bridge between the game's AgentBridge autoload and the shell
  let gameCallback = null;
  const queue = [];
  window.__agentBridgeRegister = (cb) => {
    gameCallback = cb;
    while (queue.length) cb(queue.shift());
  };
  window.__agentBridgeSend = (text) => post({ kind: 'game', data: text });
  window.addEventListener('message', (e) => {
    if (e.origin !== parentOrigin || !e.data || !e.data.__gck || e.data.kind !== 'command') return;
    if (gameCallback) gameCallback(e.data.data); else queue.push(e.data.data);
  });

  function fail(err) {
    const text = err instanceof Error ? err.message : String(err);
    statusEl.classList.add('error');
    statusEl.style.display = 'flex';
    statusText.textContent = text;
    progress.style.display = 'none';
    post({ kind: 'status', state: 'crashed', build, error: text });
  }

  window.addEventListener('error', (e) => post({ kind: 'console', level: 'error', text: `[js] ${e.message}` }));
  window.addEventListener('unhandledrejection', (e) => post({ kind: 'console', level: 'error', text: `[js] ${e.reason}` }));
  document.getElementById('canvas').addEventListener('pointerdown', () => post({ kind: 'focus' }));

  if (!enginePath || !pck) return fail('missing engine or pck parameter');

  const script = document.createElement('script');
  script.src = enginePath + 'godot.js';
  script.onerror = () => fail('could not load engine from ' + script.src);
  script.onload = () => {
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) return fail('Browser is missing features required by Godot:\n' + missing.join('\n'));
    post({ kind: 'status', state: 'loading', build });
    const engine = new Engine({
      executable: enginePath + 'godot',
      mainPack: pck,
      canvas: document.getElementById('canvas'),
      canvasResizePolicy: 2,
      focusCanvas: true,
      args: [],
      onPrint: (...parts) => post({ kind: 'console', level: 'info', text: parts.join(' ') }),
      onPrintError: (...parts) => {
        const text = parts.join(' ');
        post({ kind: 'console', level: /^\s*WARNING/.test(text) ? 'warning' : 'error', text });
      },
      onExit: (code) => post({ kind: 'status', state: 'exited', build, error: code ? `exit code ${code}` : undefined }),
    });
    engine.startGame({
      onProgress: (cur, total) => {
        if (cur > 0 && total > 0) { progress.value = cur; progress.max = total; statusText.textContent = `Loading build ${build}… ${Math.round(cur / total * 100)}%`; }
      },
    }).then(() => {
      statusEl.style.display = 'none';
      post({ kind: 'status', state: 'started', build });
    }, fail);
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
